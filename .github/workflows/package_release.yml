name: Android Debug APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build and upload Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify Debug APK exists
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/**/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No Debug APK was produced."
            exit 1
          fi
          printf 'Generated APK: %s\n' "${apks[@]}"

      - name: Upload Debug APK for download
        uses: actions/upload-artifact@v6
        with:
          name: Cooper-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
